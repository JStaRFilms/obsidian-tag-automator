<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Obsidian Tag Automator</title>
  <meta name="description" content="AI-powered tag management system for your Obsidian vault. Automate tagging, suggest aliases, and maintain consistency across your knowledge base.">
  <meta name="theme-color" content="#0ea5e9">
  <link rel="icon" type="image/svg+xml" href="/vite.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    /* Loading screen styles */
    .loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #1e3a8a 0%, #0f172a 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    .loading-screen.fade-out {
      opacity: 0;
      visibility: hidden;
    }

    .loading-spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(56, 189, 248, 0.2);
      border-radius: 50%;
      border-top-color: #38bdf8;
      animation: spin 1s ease-in-out infinite;
      margin-bottom: 1rem;
    }

    .loading-text {
      color: #e2e8f0;
      font-family: 'Inter', sans-serif;
      font-size: 1.125rem;
      font-weight: 500;
      margin-bottom: 0.5rem;
    }

    .loading-subtitle {
      color: #94a3b8;
      font-family: 'Inter', sans-serif;
      font-size: 0.875rem;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* Hide loading screen when Vue app is ready */
    .loading-screen.ready {
      display: none;
    }
  </style>
</head>
<body>
  <!-- Loading Screen -->
  <div id="loading-screen" class="loading-screen">
    <div class="loading-spinner"></div>
    <div class="loading-text">Loading Obsidian Tag Automator</div>
    <div class="loading-subtitle">Initializing modern web interface...</div>
  </div>

  <!-- Vue App Container -->
  <div id="app"></div>

  <!-- Fallback for JavaScript disabled -->
  <noscript>
    <div style="
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #1e3a8a 0%, #0f172a 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #e2e8f0;
      font-family: 'Inter', sans-serif;
      text-align: center;
      padding: 2rem;
    ">
      <div style="
        width: 80px;
        height: 80px;
        border-radius: 50%;
        background: rgba(56, 189, 248, 0.1);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 2rem;
        border: 2px solid rgba(56, 189, 248, 0.3);
      ">
        <svg width="32" height="32" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="color: #38bdf8;">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L4.082 16.5c-.77.833.192 2.5 1.732 2.5z"></path>
        </svg>
      </div>
      <h1 style="font-size: 1.875rem; font-weight: 700; margin-bottom: 1rem;">JavaScript Required</h1>
      <p style="font-size: 1.125rem; margin-bottom: 1rem;">Obsidian Tag Automator requires JavaScript to function properly.</p>
      <p style="font-size: 0.875rem; color: #94a3b8; max-width: 400px;">
        Please enable JavaScript in your browser settings and reload this page to access the modern web interface.
      </p>
      <div style="margin-top: 2rem;">
        <a href="/legacy" style="
          display: inline-flex;
          align-items: center;
          padding: 0.75rem 1.5rem;
          background: #38bdf8;
          color: white;
          text-decoration: none;
          border-radius: 0.5rem;
          font-weight: 500;
          transition: background-color 0.2s;
        " onmouseover="this.style.backgroundColor='#0ea5e9'" onmouseout="this.style.backgroundColor='#38bdf8'">
          Use Legacy Interface
        </a>
      </div>
    </div>
  </noscript>

  <script type="module" src="/src/main.js"></script>

  <!-- Performance monitoring (development only) -->
  <script>
    // Hide loading screen when Vue app is mounted
    window.addEventListener('load', () => {
      // Give Vue a moment to initialize
      setTimeout(() => {
        const loadingScreen = document.getElementById('loading-screen');
        if (loadingScreen) {
          loadingScreen.classList.add('fade-out');
          setTimeout(() => {
            loadingScreen.style.display = 'none';
          }, 300);
        }
      }, 100);
    });

    // Performance monitoring
    window.addEventListener('vue:mounted', () => {
      console.log('🚀 Obsidian Tag Automator Vue.js app mounted successfully');
      console.log('📊 Performance metrics:', {
        'DOM Content Loaded': performance.getEntriesByName('domContentLoaded')[0]?.duration || 'N/A',
        'Load Event': performance.getEntriesByName('load')[0]?.duration || 'N/A',
        'Total JS Heap Size': performance.memory?.totalJSHeapSize || 'N/A',
        'Used JS Heap Size': performance.memory?.usedJSHeapSize || 'N/A'
      });
    });

    // Error boundary
    window.addEventListener('error', (event) => {
      console.error('🚨 Global error:', event.error);
      const loadingScreen = document.getElementById('loading-screen');
      if (loadingScreen) {
        loadingScreen.innerHTML = `
          <div style="text-align: center; color: #ef4444;">
            <svg width="48" height="48" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="margin-bottom: 1rem;">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L4.082 16.5c-.77.833.192 2.5 1.732 2.5z"></path>
            </svg>
            <div style="font-size: 1.125rem; font-weight: 500; margin-bottom: 0.5rem;">Application Error</div>
            <div style="font-size: 0.875rem; color: #94a3b8; margin-bottom: 1rem;">Something went wrong while loading the application.</div>
            <button onclick="location.reload()" style="
              padding: 0.75rem 1.5rem;
              background: #ef4444;
              color: white;
              border: none;
              border-radius: 0.5rem;
              font-weight: 500;
              cursor: pointer;
            ">Reload Application</button>
          </div>
        `;
      }
    });

    // Service worker registration (for future PWA features)
    // Temporarily disabled until we create the service worker file
    // if ('serviceWorker' in navigator) {
    //   window.addEventListener('load', () => {
    //     navigator.serviceWorker.register('/sw.js')
    //       .then(registration => {
    //         console.log('🔧 ServiceWorker registered:', registration.scope);
    //       })
    //       .catch(error => {
    //         console.log('❌ ServiceWorker registration failed:', error);
    //       });
    //   });
    // }
  </script>
</body>
</html>
